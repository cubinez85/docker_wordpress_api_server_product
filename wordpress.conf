# HTTP редирект с www на основной домен
server {
    listen 80;
    listen [::]:80;
    server_name www.wordpress.cubinez.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://wordpress.cubinez.ru$request_uri;
    }
}

# HTTP → HTTPS редирект (основной домен)
server {
    listen 80;
    listen [::]:80;
    server_name wordpress.cubinez.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS сервер (основной домен)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wordpress.cubinez.ru;

    # SSL сертификаты
    ssl_certificate /etc/letsencrypt/live/wordpress.cubinez.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wordpress.cubinez.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Healthcheck API
    location = /api/health {
        proxy_pass http://127.0.0.1:8081/api/health;
        access_log off;
        proxy_read_timeout 5s;
    }

    # Статические файлы API
    location /api/static/ {
        proxy_pass http://127.0.0.1:8081/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # API endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 10M;

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        access_log /var/log/nginx/api-access.log;
        error_log /var/log/nginx/api-error.log;
    }

    # WordPress
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 64M;
    }

    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
